<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Signup</title>
</head>
<body>

<h2>Signup Page</h2>


<form action="/save-user" method="post">

    <input type="text"
           name="username"
           placeholder="Enter Username"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Enter Password"
           required>

    <br><br>

    <button type="submit">
        Signup
    </button>

</form>

<a href="/login">Login</a>

</body>
</html>
