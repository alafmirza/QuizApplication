<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Quiz App</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
            min-height: 100vh;
        }

        .quiz-card{
            border-radius: 18px;
            transition: 0.3s;
        }

        .quiz-card:hover{
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .header-box{
            border-radius: 20px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <!-- Top Bar -->

    <div class="d-flex justify-content-between align-items-center mb-5">

        <div>

            <h1 class="fw-bold text-primary">
                <i class="bi bi-patch-question-fill"></i>
                Quiz App
            </h1>

            <p class="text-muted mb-0">
                Choose a quiz and start learning
            </p>

        </div>

        <a href="/logout"
           class="btn btn-danger rounded-pill px-4 shadow-sm">

            <i class="bi bi-box-arrow-right"></i>
            Logout

        </a>

    </div>

    <!-- Quiz List -->

    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="quiz : ${quizzes}">

            <a th:href="@{'/quiz-page/' + ${quiz.id}}"
               class="text-decoration-none">

                <div class="card quiz-card shadow-sm h-100 border-0">

                    <div class="card-body text-center p-5">

                        <i class="bi bi-journal-richtext display-3 text-primary"></i>

                        <h4 class="mt-4 text-dark fw-bold"
                            th:text="${quiz.title}">
                        </h4>

                        <p class="text-muted mt-2">
                            Click to start this quiz
                        </p>

                        <button class="btn btn-primary rounded-pill px-4 mt-3">

                            Start Quiz

                        </button>

                    </div>

                </div>

            </a>

        </div>

    </div>

</div>

</body>

</html>
