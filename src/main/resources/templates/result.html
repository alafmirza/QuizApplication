<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background: linear-gradient(to right, #141e30, #243b55);
            height: 100vh;
        }

        .result-card{
            width: 450px;
            border-radius: 20px;
            border: none;
        }

        .score-text{
            font-size: 60px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card result-card shadow-lg p-5 text-center">

        <i class="bi bi-trophy-fill display-1 text-warning"></i>

        <h2 class="mt-3 fw-bold">
            Quiz Completed!
        </h2>

        <p class="text-muted">
            Here is your final score
        </p>

        <h1 class="score-text text-success mt-3"
            th:text="${score}">
        </h1>

        <p class="text-muted">
            Keep practicing to improve your score 🚀
        </p>

        <a href="/"
           class="btn btn-primary btn-lg rounded-pill mt-3 px-5 shadow-sm">

            <i class="bi bi-house-door-fill"></i>
            Back to Home

        </a>

    </div>

</div>

</body>

</html>
